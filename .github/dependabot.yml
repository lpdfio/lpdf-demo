# Each demo is pinned to an exact SDK version, so a release does not break it and does not reach it either. This opens a
# pull request for a demo when its package has a new version, and CI renders the demo with it: a pull request that
# passes moves the pin, and one that fails is the cue for changing the demo to the new API. Merging stays with the
# maintainers, so a pin moves when someone chose it to.
#
# The four SDKs are versioned apart (the Python package had a patch the others did not), which is why there is a
# pull request for each demo and not one for the release. A version is proposed 3 days after it is published, so a
# release that is replaced by a fix at once is not proposed twice.
version: 2
updates:
  - package-ecosystem: npm
    directory: /node
    schedule:
      interval: daily
    cooldown:
      default-days: 3

  - package-ecosystem: composer
    directory: /php
    schedule:
      interval: daily
    cooldown:
      default-days: 3

  - package-ecosystem: pip
    directory: /python
    schedule:
      interval: daily
    cooldown:
      default-days: 3

  - package-ecosystem: nuget
    directory: /dotnet
    schedule:
      interval: daily
    cooldown:
      default-days: 3
